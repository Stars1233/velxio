# Keeps the sponsor wall in README.md current.
#
# Current sponsors are public data, so the built-in GITHUB_TOKEN is enough
# and this workflow needs no secret. To have past sponsors come from the API
# instead of the generator's page fallback, add a SPONSORS_TOKEN secret whose
# only scope is `read:user`.

name: Sponsors

on:
  schedule:
    # Mondays, 05:17 UTC. Off the hour: GitHub drops scheduled runs that pile
    # up on the exact hour across the whole platform.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sponsors
  cancel-in-progress: false

jobs:
  update:
    name: Refresh the sponsor wall
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job commits, so it keeps the checkout credentials on purpose.
      - uses: actions/checkout@v4 # zizmor: ignore[artipacked]

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate the sponsor wall
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
        run: node scripts/generate-sponsors.mjs

      - name: Commit if it changed
        run: |
          if git diff --quiet README.md; then
            echo "No change."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'chore(readme): refresh the sponsor wall'
          git push
